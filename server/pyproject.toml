[project]
name = "gemma4-irodori-chat-server"
version = "0.1.0"
description = "Conversation server for Irodori Voice"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.137.2",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.15.17",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
